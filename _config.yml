title: "Solrac Junio"
url: "https://solracjunio.github.io"
description: >- 
  Blog sobre desenvolvimento de jogos, artes, e projetos pessoais.

#theme: minimal-mistakes-jekyll
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "dark"

include: ["_pages"]

search: true

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      show_date: true
      toc: true
      toc_sticky: true
      read_time: true
      comments: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/solracjunio"
    - label: "Instagram"
      icon: "fab fa-instagram"
      url: "https://www.instagram.com/pixizora/"
    - label: "Steam"
      icon: "fab fa-steam"
      url: "https://store.steampowered.com/curator/45368367-Pixizora/"

comments:
  provider: "manual"

exclude:
  - .devbox/
  - devbox.json
  - devbox.lock
  - vendor/
  - .bundle/
  - .jekyll-cache/
  - .sass-cache/
  - _site/
  - Gemfile
  - Gemfile.lock
  - node_modules/
