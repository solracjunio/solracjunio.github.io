<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa4b1"/>
    </marker>
  </defs>
  <rect width="860" height="470" fill="#252a34"/>

  <!-- Dados -->
  <text x="30" y="36" fill="#eaeaea" font-size="16" font-weight="bold">Dados em arquivo</text>
  <rect x="30" y="50" width="170" height="40" rx="6" fill="#2f4a3a" stroke="#6fcf97"/>
  <text x="115" y="75" fill="#eaeaea" text-anchor="middle">game.zon</text>
  <rect x="30" y="100" width="170" height="40" rx="6" fill="#2f4a3a" stroke="#6fcf97"/>
  <text x="115" y="125" fill="#eaeaea" text-anchor="middle">classes.zon</text>
  <rect x="30" y="150" width="170" height="40" rx="6" fill="#2f4a3a" stroke="#6fcf97"/>
  <text x="115" y="175" fill="#eaeaea" text-anchor="middle">waves.zon</text>
  <text x="115" y="215" fill="#9aa4b1" text-anchor="middle" font-size="12">lidos ao abrir o jogo</text>

  <!-- World -->
  <rect x="290" y="70" width="230" height="110" rx="8" fill="#2c3e57" stroke="#56a0f5" stroke-width="2"/>
  <text x="405" y="98" fill="#eaeaea" text-anchor="middle" font-size="16" font-weight="bold">World</text>
  <text x="405" y="122" fill="#c9d3df" text-anchor="middle" font-size="12">patinhos, inimigos, projéteis</text>
  <text x="405" y="140" fill="#c9d3df" text-anchor="middle" font-size="12">(MultiArrayList + Pool com generation)</text>
  <text x="405" y="160" fill="#c9d3df" text-anchor="middle" font-size="12">relações (Segue, Mira) · vida da fila</text>
  <line x1="200" y1="120" x2="286" y2="120" stroke="#9aa4b1" stroke-width="2" marker-end="url(#a)"/>

  <!-- UI -->
  <rect x="620" y="70" width="210" height="110" rx="8" fill="#3d3550" stroke="#b18cf2"/>
  <text x="725" y="98" fill="#eaeaea" text-anchor="middle" font-size="16" font-weight="bold">Tela (raylib)</text>
  <text x="725" y="122" fill="#c9d3df" text-anchor="middle" font-size="12">desenho, HUD</text>
  <text x="725" y="140" fill="#c9d3df" text-anchor="middle" font-size="12">overlay de debug (F1)</text>
  <text x="725" y="160" fill="#c9d3df" text-anchor="middle" font-size="12">só lê o World</text>
  <line x1="616" y1="125" x2="524" y2="125" stroke="#9aa4b1" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="570" y="115" fill="#9aa4b1" text-anchor="middle" font-size="12">lê</text>

  <!-- Sistemas -->
  <text x="30" y="270" fill="#eaeaea" font-size="16" font-weight="bold">Sistemas (um por arquivo, em ordem a cada passo)</text>
  <g font-size="12" fill="#eaeaea" text-anchor="middle">
    <rect x="30"  y="285" width="88" height="34" rx="5" fill="#4a3f2a" stroke="#f2c94c"/><text x="74"  y="307">mover</text>
    <rect x="126" y="285" width="88" height="34" rx="5" fill="#4a3f2a" stroke="#f2c94c"/><text x="170" y="307">seguir</text>
    <rect x="222" y="285" width="88" height="34" rx="5" fill="#4a3f2a" stroke="#f2c94c"/><text x="266" y="307">spawner</text>
    <rect x="318" y="285" width="88" height="34" rx="5" fill="#4a3f2a" stroke="#f2c94c"/><text x="362" y="307">perseguir</text>
    <rect x="414" y="285" width="88" height="34" rx="5" fill="#4a3f2a" stroke="#f2c94c"/><text x="458" y="307">mirar</text>
    <rect x="510" y="285" width="88" height="34" rx="5" fill="#4a3f2a" stroke="#f2c94c"/><text x="554" y="307">atacar</text>
    <rect x="606" y="285" width="88" height="34" rx="5" fill="#4a3f2a" stroke="#f2c94c"/><text x="650" y="307">magia</text>
    <rect x="702" y="285" width="128" height="34" rx="5" fill="#4a3f2a" stroke="#f2c94c"/><text x="766" y="307">projéteis · contato</text>
    <rect x="30"  y="327" width="130" height="34" rx="5" fill="#4a3f2a" stroke="#f2c94c"/><text x="95"  y="349">aplicar_dano</text>
    <rect x="168" y="327" width="130" height="34" rx="5" fill="#4a3f2a" stroke="#f2c94c"/><text x="233" y="349">limpar_mortos</text>
    <rect x="306" y="327" width="88"  height="34" rx="5" fill="#4a3f2a" stroke="#f2c94c"/><text x="350" y="349">ondas</text>
  </g>
  <text x="420" y="349" fill="#9aa4b1" font-size="12">nenhum sistema importa outro</text>
  <line x1="405" y1="184" x2="405" y2="280" stroke="#9aa4b1" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="415" y="236" fill="#9aa4b1" font-size="12">leem e escrevem dados</text>

  <!-- Eventos -->
  <rect x="30" y="395" width="800" height="50" rx="8" fill="#4a2f35" stroke="#eb5757" stroke-width="2"/>
  <text x="430" y="418" fill="#eaeaea" text-anchor="middle" font-size="15" font-weight="bold">Fila de eventos</text>
  <text x="430" y="436" fill="#c9d3df" text-anchor="middle" font-size="12">damage · died · wave_ended · duck_joined  —  a única forma de um sistema "falar" com outro</text>
  <line x1="600" y1="323" x2="600" y2="391" stroke="#9aa4b1" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="610" y="365" fill="#9aa4b1" font-size="12">publicam / consomem</text>
</svg>
